name: Scheduled Cleanup

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  close-stale-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/stale@v9
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: 'This issue has been inactive for 60 days and will be closed in 7 days if no further activity occurs.'
        stale-pr-message: 'This PR has been inactive for 30 days and will be closed in 7 days if no further activity occurs.'
        close-issue-message: 'Closing due to inactivity. Feel free to reopen if still relevant.'
        close-pr-message: 'Closing due to inactivity. Feel free to reopen if you plan to continue work.'
        days-before-stale: 60
        days-before-pr-stale: 30
        days-before-close: 7
        stale-issue-label: 'stale'
        stale-pr-label: 'stale'
        exempt-issue-labels: 'pinned,security,roadmap'
        exempt-pr-labels: 'pinned,security'

  cleanup-old-artifacts:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Delete old artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const daysToKeep = 30;
          const cutoffDate = new Date();
          cutoffDate.setDate(cutoffDate.getDate() - daysToKeep);
          
          const artifacts = await github.paginate(
            github.rest.actions.listArtifactsForRepo,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
            }
          );
          
          for (const artifact of artifacts) {
            const createdAt = new Date(artifact.created_at);
            if (createdAt < cutoffDate) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              console.log(`Deleted artifact: ${artifact.name} (${artifact.id})`);
            }
          }

  cleanup-old-workflow-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Delete old workflow runs
      uses: actions/github-script@v7
      with:
        script: |
          const daysToKeep = 90;
          const cutoffDate = new Date();
          cutoffDate.setDate(cutoffDate.getDate() - daysToKeep);
          
          const workflows = await github.paginate(
            github.rest.actions.listRepoWorkflows,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
            }
          );
          
          for (const workflow of workflows) {
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow.id,
                status: 'completed'
              }
            );
            
            for (const run of runs) {
              const createdAt = new Date(run.created_at);
              if (createdAt < cutoffDate) {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                console.log(`Deleted run ${run.id} from ${workflow.name}`);
              }
            }
          }
